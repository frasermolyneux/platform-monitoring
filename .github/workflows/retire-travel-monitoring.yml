name: Retire Unreferenced Travel Monitoring Group

on:
  workflow_dispatch:

permissions: {}

jobs:
  retire:
    if: github.ref == 'refs/heads/main'
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.repository }}-prd
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Require preserved routing and zero complete-inventory references before exact cleanup
        run: python3 .github/scripts/smart_detection_handover.py --retire-old-group
